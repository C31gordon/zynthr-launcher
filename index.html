<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050507">
<title>ZYNTHR</title>
<style>
/* ============================================================
   ZYNTHR OPERATING ENVIRONMENT
   Pentagon Briefing · Corry Station · July 28 2026
   R13 Visual Language — near-black, teal accent, mono labels
   ============================================================ */
:root {
  --bg:          #06060a;
  --surface:     #10101a;   /* clearly distinct wedge fill */
  --teal:        #0d9488;
  --teal-bright: #14b8a6;
  --teal-dim:    rgba(13, 148, 136, 0.15);
  --teal-border: rgba(20, 184, 166, 0.6);  /* projector-visible teal stroke */
  --text:        #d8eaf4;
  --text-dim:    #d0e4ee;   /* wedge labels — near-white for projectors */
  --text-muted:  #5a7888;  /* secondary subtext */
  --mono:        'Courier New', 'Courier', 'Lucida Console', monospace;
  --sans:        'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  overflow: hidden;
  font-family: var(--mono);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Grid backdrop + center vignette — FORTE reference language */
.launcher {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse 60% 60% at 50% 50%,
      rgba(60,110,160,0.06) 0%,
      transparent 70%),
    linear-gradient(rgba(110,150,200,0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(110,150,200,0.045) 1px, transparent 1px);
  background-size: 100% 100%, 56px 56px, 56px 56px;
}

.wheel-container {
  position: relative;
  width:  min(84vw, 84vh);
  height: min(84vw, 84vh);
}

.wheel-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* ─── Wedge elements — per-wedge neon accents ─── */
.wedge { cursor: pointer; }

.wedge-bg {
  stroke-width: 1.6;
  fill-opacity: 1;
  filter: drop-shadow(0 0 5px currentColor);
  transition: filter 0.25s ease, stroke-width 0.25s ease, fill-opacity 0.25s ease;
}

.wedge:hover .wedge-bg {
  stroke-width: 2.2;
  filter: drop-shadow(0 0 14px currentColor) drop-shadow(0 0 26px currentColor);
}

.wedge-label {
  fill: #e8f2f8;
  font-family: var(--mono);
  letter-spacing: 3;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  transition: fill 0.22s ease;
}

.wedge:hover .wedge-label { fill: #ffffff; }

.wedge-key {
  font-family: var(--mono);
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  opacity: 0.9;
  font-weight: bold;
  transition: opacity 0.22s ease;
}

.wedge:hover .wedge-key { opacity: 1; }

/* ─── Hub rings ─── */
.hub-bg    { fill: #0a0d14; }
.hub-ring  { fill: none; stroke: rgba(110,160,210,0.35); stroke-width: 1; }
.hub-dash  {
  fill: none; stroke: rgba(140,180,220,0.5); stroke-width: 1.2;
  stroke-dasharray: 2.5 7;
  animation: hub-rotate 90s linear infinite;
  transform-origin: 0 0;
}
@keyframes hub-rotate { to { transform: rotate(360deg); } }
.hub-pulse { fill: none; stroke: var(--teal); stroke-width: 0.8; }

@keyframes breathe {
  0%,100% { stroke-opacity: 0.25; }
  50%      { stroke-opacity: 0.75; }
}
@keyframes outer-drift {
  0%,100% { stroke-opacity: 0.12; }
  50%      { stroke-opacity: 0.28; }
}

.hub-pulse   { animation: breathe 4.5s ease-in-out infinite; }
.outer-ring  {
  fill: none; stroke: var(--teal); stroke-width: 0.3;
  stroke-dasharray: 3 8;
  animation: outer-drift 7s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  .hub-pulse, .outer-ring { animation: none; stroke-opacity: 0.3; }
  .wedge-bg, .wedge-label { transition: none; }
}

/* ─── Hub HTML overlay ─── */
.hub-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.hub-text { text-align: center; }

.wordmark {
  font-family: var(--sans);
  font-size:   2vmin;
  font-weight: 200;
  letter-spacing: 0.55em;
  padding-right: 0.55em;   /* compensate trailing kerning */
  color: var(--teal-bright);
  text-transform: uppercase;
  display: block;
}

.subline {
  font-family: var(--mono);
  font-size:   0.82vmin;
  letter-spacing: 0.16em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-top: 7px;
  line-height: 1.6;
  opacity: 0.85;
}

/* ─── Vision bottom affordance ─── */
.vision-link {
  position: fixed;
  bottom: clamp(18px, 3.2vh, 40px);
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: clamp(8px, 0.85vmin, 11px);
  letter-spacing: 0.3em;
  color: var(--text-dim);
  text-decoration: none;
  text-transform: uppercase;
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.2s;
  white-space: nowrap;
  padding: 8px 20px;
}
.vision-link::before { content: '—\00a0'; }
.vision-link::after  { content: '\00a0—'; }
.vision-link:hover   { color: var(--teal-bright); }

/* ─── Corner system tag ─── */
/* ─── Splash — cinematic opening screen ─── */
#splash {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000;
  cursor: pointer;
  overflow: hidden;
  opacity: 1;
  transition: opacity 1.4s ease;
}
#splash.dismissed { opacity: 0; pointer-events: none; }
#splash img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: splashZoom 45s ease-out forwards;
  transform-origin: 50% 42%;
}
@keyframes splashZoom {
  from { transform: scale(1.0); }
  to   { transform: scale(1.08); }
}
#splash .splash-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 75% at 50% 45%, transparent 55%, rgba(0,0,0,0.55) 100%);
  pointer-events: none;
}
#splash .splash-hint {
  position: absolute;
  bottom: 4.5%;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: rgba(216, 234, 244, 0.0);
  animation: hintFade 3s ease 5s forwards, hintPulse 3.6s ease-in-out 8s infinite;
  pointer-events: none;
}
@keyframes hintFade { to { color: rgba(216, 234, 244, 0.45); } }
@keyframes hintPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.45; }
}

/* Wheel entrance after splash */
body.pre-enter .launcher,
body.pre-enter .vision-link,
body.pre-enter .sys-tag { opacity: 0; }
body.entering .launcher {
  animation: wheelIn 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
body.entering .vision-link,
body.entering .sys-tag {
  animation: fadeIn 1.6s ease 0.6s forwards;
}
@keyframes wheelIn {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes fadeIn { to { opacity: 0.5; } }

.sys-tag {
  position: fixed;
  top: clamp(14px, 2vh, 24px);
  right: clamp(18px, 2vw, 32px);
  font-family: var(--mono);
  font-size: clamp(7px, 0.65vmin, 9px);
  letter-spacing: 0.2em;
  color: var(--text-muted);
  text-transform: uppercase;
  opacity: 0.5;
  pointer-events: none;
}
</style>
</head>
<body class="pre-enter">

<div id="splash">
  <img src="splash.jpg" alt="">
  <div class="splash-vignette"></div>
  <div class="splash-hint">Click to Enter</div>
</div>

<div class="launcher">
  <div class="wheel-container">
    <svg class="wheel-svg" viewBox="-500 -500 1000 1000" id="wheel"></svg>
    <div class="hub-overlay">
      <div class="hub-text">
        <span class="wordmark">ZYNTHR</span>
        <div class="subline">DECISION INTELLIGENCE<br>FOR MILITARY INFRASTRUCTURE</div>
      </div>
    </div>
  </div>
</div>

<a class="vision-link" href="vision.html" title="Press V or 5">VISION</a>
<div class="sys-tag">OPERATING ENVIRONMENT</div>

<script>
/* ─── Wheel Configuration ─────────────────────────────────── */
const WEDGES = [
  { label:'COMMAND',      angle:  0, key:'1', url:'https://zynthr-todays-brief.vercel.app',           color:'#5ba8ff' },
  { label:'INSTALLATIONS',angle: 45, key:'2', url:'https://installation-attention-view.vercel.app',  color:'#38bdf8' },
  { label:'OPERATIONS',   angle: 90, key:'3', url:'https://baas-maintenance.vercel.app/t/navy/wo/9c9259b4-9e60-4225-8642-fdc08353c7ab',             color:'#2dd4bf' },
  { label:'EVIDENCE',     angle:135, key:null, url:'evidence.html',      color:'#4ade80' },
  { label:'INTEGRATIONS', angle:180, key:null, url:'integrations.html',  color:'#a3e635' },
  { label:'GOVERNANCE',   angle:225, key:null, url:'governance.html',    color:'#f472b6' },
  { label:'ANALYTICS',    angle:270, key:null, url:'analytics.html',     color:'#fb923c' },
  { label:'DEPLOYMENT',   angle:315, key:'4', url:'deployment.html',     color:'#b794ff' },
];

/* ─── Geometry ─────────────────────────────────────────────── */
const R1       = 154;   // inner radius (gap between hub and wedges)
const R2       = 442;   // outer radius
const GAP_EACH = 2.6;   // degrees of gap on each side of each wedge boundary
const LABEL_R  = 306;   // radial position of word labels
const KEY_R    = 414;   // radial position of keyboard-hint digits
const OUTER_R  = 468;   // decorative outer ring

const ns = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('wheel');

const toRad = d => d * Math.PI / 180;

// Polar to Cartesian — 0° = top, clockwise
function pt(r, deg) {
  const rad = toRad(deg - 90);
  return { x: r * Math.cos(rad), y: r * Math.sin(rad) };
}

// SVG path for an annular sector
function sector(r1, r2, startDeg, endDeg) {
  const s1 = pt(r1, startDeg), e1 = pt(r1, endDeg);
  const s2 = pt(r2, startDeg), e2 = pt(r2, endDeg);
  const big = (endDeg - startDeg) > 180 ? 1 : 0;
  const f = v => v.toFixed(3);
  return [
    `M${f(s1.x)} ${f(s1.y)}`,
    `L${f(s2.x)} ${f(s2.y)}`,
    `A${r2} ${r2} 0 ${big} 1 ${f(e2.x)} ${f(e2.y)}`,
    `L${f(e1.x)} ${f(e1.y)}`,
    `A${r1} ${r1} 0 ${big} 0 ${f(s1.x)} ${f(s1.y)} Z`,
  ].join(' ');
}

function el(tag, attrs = {}) {
  const e = document.createElementNS(ns, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  return e;
}

/* ─── Build SVG ─────────────────────────────────────────────── */
// Per-wedge radial gradients — dark at hub, tinted glow at rim
const defs = el('defs');
WEDGES.forEach((w, i) => {
  const grad = el('radialGradient', {
    id: `wg${i}`, gradientUnits: 'userSpaceOnUse',
    cx: 0, cy: 0, r: R2,
  });
  [['30%',0.02],['78%',0.10],['100%',0.22]].forEach(([off,op]) => {
    grad.appendChild(el('stop', { offset: off, 'stop-color': w.color, 'stop-opacity': op }));
  });
  defs.appendChild(grad);
});
svg.appendChild(defs);

// Hub background circle
svg.appendChild(el('circle', { cx:0, cy:0, r:152, class:'hub-bg' }));

// Wedges
const HALF_SPAN = (360 / 8) / 2 - GAP_EACH; // 22.5 - 2.6 = 19.9°

WEDGES.forEach(w => {
  const start = w.angle - HALF_SPAN;
  const end   = w.angle + HALF_SPAN;
  const lp    = pt(LABEL_R, w.angle);
  const g = el('g', { class:'wedge' });

  // Wedge shape — per-wedge neon stroke + gradient fill
  const i = WEDGES.indexOf(w);
  g.style.color = w.color;   // drives currentColor drop-shadow glow
  g.appendChild(el('path', {
    d: sector(R1, R2, start, end), class:'wedge-bg',
    fill: `url(#wg${i})`, stroke: w.color,
  }));

  // Word label (horizontal, centered in wedge)
  const txt = el('text', {
    x: lp.x.toFixed(2), y: lp.y.toFixed(2),
    class: 'wedge-label',
    'font-size': '15',
    'letter-spacing': '3',
  });
  txt.textContent = w.label;
  g.appendChild(txt);

  // Keyboard shortcut hint near outer edge
  if (w.key) {
    const kp = pt(KEY_R, w.angle);
    const kt = el('text', {
      x: kp.x.toFixed(2), y: kp.y.toFixed(2),
      class: 'wedge-key',
      'font-size': '9',
      fill: w.color,
    });
    kt.textContent = w.key;
    g.appendChild(kt);
  }

  g.addEventListener('click', () => { window.location = w.url; });
  svg.appendChild(g);
});

// Hub rings (drawn on top so hub stays crisp over wedge edges)
svg.appendChild(el('circle', { cx:0, cy:0, r:154, class:'hub-ring' }));
svg.appendChild(el('circle', { cx:0, cy:0, r:136, class:'hub-dash' }));
svg.appendChild(el('circle', { cx:0, cy:0, r:148, class:'hub-pulse' }));

// Outer decorative ring
svg.appendChild(el('circle', { cx:0, cy:0, r:OUTER_R, class:'outer-ring' }));

/* ─── Keyboard navigation ────────────────────────────────────── */
/* ─── Splash dismissal ─── */
const splash = document.getElementById('splash');
let splashActive = true;

function enterSystem() {
  if (!splashActive) return;
  splashActive = false;
  splash.classList.add('dismissed');
  document.body.classList.remove('pre-enter');
  document.body.classList.add('entering');
  setTimeout(() => splash.remove(), 1600);
}

splash.addEventListener('click', enterSystem);

document.addEventListener('keydown', e => {
  if (splashActive) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { enterSystem(); return; }
    // number keys fall through — presenter can jump straight to a section
  }
  switch (e.key) {
    case '1': window.location = WEDGES[0].url; break;  // COMMAND
    case '2': window.location = WEDGES[1].url; break;  // INSTALLATIONS
    case '3': window.location = WEDGES[2].url; break;  // OPERATIONS
    case '4': window.location = WEDGES[7].url; break;  // DEPLOYMENT
    case '5':
    case 'v':
    case 'V': window.location = 'vision.html'; break;  // VISION
  }
});
</script>
</body>
</html>
